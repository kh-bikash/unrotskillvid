<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scene 4: Open Source License & CTA</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 400;
        src: url(../assets/fonts/geist-400.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 600;
        src: url(../assets/fonts/geist-600.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 700;
        src: url(../assets/fonts/geist-700.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1080px;
        height: 1920px;
        background: transparent;
        color: #e6edf3;
        font-family: "Geist", sans-serif;
        overflow: hidden;
      }

      .scene-wrap {
        position: relative;
        width: 1080px;
        height: 1920px;
        padding: 180px 72px 140px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .mit-badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 10px 24px;
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(56, 189, 248, 0.4);
        border-radius: 9999px;
        color: #38bdf8;
        font-size: 24px;
        font-weight: 600;
        width: fit-content;
      }

      .terminal-run {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 32px;
        padding: 48px;
        margin: 40px 0;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
      }

      .term-title {
        font-size: 24px;
        color: #8b949e;
        margin-bottom: 20px;
      }

      .code-cmd {
        background: #0d1117;
        padding: 24px;
        border-radius: 16px;
        border: 1px solid #21262d;
        font-size: 30px;
        color: #7ee787;
        font-weight: 600;
      }

      .action-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 32px;
        background: linear-gradient(135deg, #1f6feb 0%, #38bdf8 100%);
        border-radius: 24px;
        color: #ffffff;
        font-size: 34px;
        font-weight: 700;
        box-shadow: 0 20px 40px rgba(31, 111, 235, 0.4);
      }

      .sub-foot {
        text-align: center;
        font-size: 26px;
        color: #8b949e;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <div id="scene4" class="clip" data-start="37.00" data-duration="11.00">
      <div class="scene-wrap">
        <div>
          <div id="badge-mit" class="mit-badge">
            <span>🔓 100% OPEN WEIGHTS · MIT LICENSE</span>
          </div>

          <div id="term-box" class="terminal-run">
            <div class="term-title">Pull model directly into Ollama or vLLM:</div>
            <div class="code-cmd">ollama run glm4.6:latest</div>
          </div>
        </div>

        <div id="action-block">
          <div class="action-btn">
            Download Weights on HuggingFace
          </div>
          <p class="sub-foot">Star the repository on GitHub</p>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#badge-mit", { opacity: 0, scale: 0.9, duration: 0.6, ease: "power2.out" }, 0.2)
        .from("#term-box", { opacity: 0, y: 30, scale: 0.94, duration: 0.8, ease: "back.out(1.3)" }, 0.5)
        .from("#action-block", { opacity: 0, y: 40, duration: 0.7, ease: "power2.out" }, 0.9)
        .to(".action-btn", { scale: 1.03, repeat: 1, yoyo: true, duration: 1.5, ease: "sine.inOut" }, 1.8);

      window.__timelines["scene4"] = tl;
    </script>
  </body>
</html>
