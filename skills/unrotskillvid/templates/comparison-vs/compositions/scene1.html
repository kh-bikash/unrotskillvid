<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scene 1: VS Hook</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 400;
        src: url(../assets/fonts/geist-400.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 600;
        src: url(../assets/fonts/geist-600.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 700;
        src: url(../assets/fonts/geist-700.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1080px;
        height: 1920px;
        background: transparent;
        color: #f5f5f5;
        font-family: "Geist", sans-serif;
        overflow: hidden;
      }

      .scene-wrap {
        position: relative;
        width: 1080px;
        height: 1920px;
        padding: 200px 72px 100px 72px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .vs-badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 10px 24px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 9999px;
        color: #ffffff;
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 36px;
      }

      .headline {
        font-size: 88px;
        line-height: 1.05;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 50px;
      }

      .vs-cards {
        width: 100%;
        display: flex;
        gap: 20px;
        align-items: center;
        justify-content: center;
        margin-top: 40px;
      }

      .fighter-card {
        flex: 1;
        background: #1c1c1c;
        border-radius: 32px;
        padding: 44px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
      }

      .card-a {
        border: 2px solid #ef4444;
      }

      .card-b {
        border: 2px solid #3b82f6;
      }

      .f-icon {
        font-size: 64px;
        margin-bottom: 16px;
      }

      .f-name {
        font-size: 32px;
        font-weight: 700;
        color: #ffffff;
      }

      .vs-circle {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #262626;
        border: 2px solid rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        font-weight: 800;
        color: #ffffff;
        flex-shrink: 0;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="scene1" class="clip" data-start="0" data-duration="8.00">
      <div class="scene-wrap">
        <div id="badge-vs" class="vs-badge">
          <span>⚔️ HEAD TO HEAD SHOWDOWN</span>
        </div>

        <h1 id="title-vs" class="headline">
          Which tool actually delivers the best results?
        </h1>

        <div class="vs-cards">
          <div id="card-a" class="fighter-card card-a">
            <div class="f-icon">🔴</div>
            <span class="f-name">Option A</span>
          </div>

          <div id="vs-symbol" class="vs-circle">VS</div>

          <div id="card-b" class="fighter-card card-b">
            <div class="f-icon">🔵</div>
            <span class="f-name">Option B</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#badge-vs", { opacity: 0, y: -20, duration: 0.6, ease: "power2.out" }, 0.2)
        .from("#title-vs", { opacity: 0, scale: 0.9, duration: 0.8, ease: "power2.out" }, 0.4)
        .from("#card-a", { opacity: 0, x: -40, duration: 0.7, ease: "back.out(1.2)" }, 0.8)
        .from("#card-b", { opacity: 0, x: 40, duration: 0.7, ease: "back.out(1.2)" }, 0.8)
        .from("#vs-symbol", { opacity: 0, scale: 0, duration: 0.5, ease: "back.out(1.8)" }, 1.2);

      window.__timelines["scene1"] = tl;
    </script>
  </body>
</html>
