<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Comparison & VS Reel</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 400;
        src: url(assets/fonts/geist-400.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 600;
        src: url(assets/fonts/geist-600.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 700;
        src: url(assets/fonts/geist-700.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #111111;
        color: #f5f5f5;
        font-family: "Geist", sans-serif;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #111111;
      }

      .bg-glow-left {
        position: absolute;
        width: 800px;
        height: 800px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(239, 68, 68, 0.15) 0%, rgba(239, 68, 68, 0) 70%);
        pointer-events: none;
        left: -150px;
        top: 200px;
      }

      .bg-glow-right {
        position: absolute;
        width: 800px;
        height: 800px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(59, 130, 246, 0) 70%);
        pointer-events: none;
        right: -150px;
        bottom: 250px;
      }

      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="44.00"
      data-width="1080"
      data-height="1920"
    >
      <div class="bg-glow-left"></div>
      <div class="bg-glow-right"></div>

      <!-- Scene 1: The Showdown Hook (0.00 - 8.00) -->
      <div
        id="slot-scene-1"
        class="clip"
        data-composition-id="scene1"
        data-composition-src="compositions/scene1.html"
        data-start="0"
        data-duration="8.00"
        data-track-index="1"
      ></div>

      <!-- Scene 2: Feature Matrix Round (8.00 - 22.00) -->
      <div
        id="slot-scene-2"
        class="clip"
        data-composition-id="scene2"
        data-composition-src="compositions/scene2.html"
        data-start="8.00"
        data-duration="14.00"
        data-track-index="1"
      ></div>

      <!-- Scene 3: Speed & Cost Benchmarks (22.00 - 33.00) -->
      <div
        id="slot-scene-3"
        class="clip"
        data-composition-id="scene3"
        data-composition-src="compositions/scene3.html"
        data-start="22.00"
        data-duration="11.00"
        data-track-index="1"
      ></div>

      <!-- Scene 4: Verdict & Final Choice (33.00 - 44.00) -->
      <div
        id="slot-scene-4"
        class="clip"
        data-composition-id="scene4"
        data-composition-src="compositions/scene4.html"
        data-start="33.00"
        data-duration="11.00"
        data-track-index="1"
      ></div>

      <audio
        id="narration"
        class="clip"
        src="assets/narration.wav"
        data-start="0"
        data-duration="44.00"
        data-track-index="10"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const mainTl = gsap.timeline({ paused: true });
      window.__timelines["main"] = mainTl;
    </script>
  </body>
</html>
