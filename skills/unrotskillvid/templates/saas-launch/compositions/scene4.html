<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scene 4: SaaS CTA & Launch</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 400;
        src: url(../assets/fonts/geist-400.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 600;
        src: url(../assets/fonts/geist-600.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 700;
        src: url(../assets/fonts/geist-700.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1080px;
        height: 1920px;
        background: transparent;
        color: #f3f4f6;
        font-family: "Geist", sans-serif;
        overflow: hidden;
      }

      .scene-wrap {
        position: relative;
        width: 1080px;
        height: 1920px;
        padding: 180px 72px 140px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .cta-badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 10px 24px;
        background: rgba(99, 102, 241, 0.15);
        border: 1px solid rgba(99, 102, 241, 0.4);
        border-radius: 9999px;
        color: #818cf8;
        font-size: 24px;
        font-weight: 600;
        width: fit-content;
      }

      .pricing-card {
        background: #181b26;
        border: 2px solid #6366f1;
        border-radius: 36px;
        padding: 56px 48px;
        text-align: center;
        box-shadow: 0 30px 70px rgba(99, 102, 241, 0.25);
        margin: 40px 0;
      }

      .card-price {
        font-size: 110px;
        font-weight: 700;
        color: #ffffff;
        line-height: 1;
        margin-bottom: 12px;
      }

      .price-sub {
        font-size: 28px;
        color: #818cf8;
        font-weight: 600;
      }

      .main-cta-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 32px;
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        border-radius: 24px;
        color: #ffffff;
        font-size: 34px;
        font-weight: 700;
        box-shadow: 0 20px 40px rgba(99, 102, 241, 0.4);
      }

      .footnote {
        text-align: center;
        font-size: 26px;
        color: #9ca3af;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <div id="scene4" class="clip" data-start="31.00" data-duration="9.00">
      <div class="scene-wrap">
        <div>
          <div id="badge-4" class="cta-badge">
            <span>🚀 14-DAY FREE TRIAL · NO CARD REQUIRED</span>
          </div>

          <div id="price-box" class="pricing-card">
            <div class="card-price">$0</div>
            <div class="price-sub">Start building in under 2 minutes</div>
          </div>
        </div>

        <div id="cta-block">
          <div class="main-cta-btn">
            Claim Your Free Account
          </div>
          <p class="footnote">Join 15,000+ teams shipping faster today</p>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#badge-4", { opacity: 0, scale: 0.9, duration: 0.6, ease: "power2.out" }, 0.2)
        .from("#price-box", { opacity: 0, y: 30, scale: 0.92, duration: 0.8, ease: "back.out(1.3)" }, 0.5)
        .from("#cta-block", { opacity: 0, y: 40, duration: 0.7, ease: "power2.out" }, 0.9)
        .to(".main-cta-btn", { scale: 1.03, repeat: 1, yoyo: true, duration: 1.5, ease: "sine.inOut" }, 1.8);

      window.__timelines["scene4"] = tl;
    </script>
  </body>
</html>
