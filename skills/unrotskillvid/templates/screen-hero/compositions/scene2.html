<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scene 2: Hero Footage</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 400;
        src: url(../assets/fonts/geist-400.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 600;
        src: url(../assets/fonts/geist-600.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1080px;
        height: 1920px;
        background: transparent;
        color: #f7f2eb;
        font-family: "Geist", sans-serif;
        overflow: hidden;
      }

      .scene-wrap {
        position: relative;
        width: 1080px;
        height: 1920px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      /* Viewport Stage for Virtual Camera */
      .viewport-stage {
        position: relative;
        width: 960px;
        height: 1200px;
        border-radius: 36px;
        overflow: hidden;
        background: #0f0c0a;
        border: 2px solid #3b332b;
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 107, 53, 0.1);
      }

      .video-wrapper {
        position: absolute;
        width: 1920px;
        height: 1080px;
        left: -480px;
        top: 60px;
        transform-origin: center center;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Inner glass highlight */
      .stage-glass-highlight {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
        pointer-events: none;
        z-index: 10;
      }

      /* Bottom Caption Bar */
      .caption-box {
        position: absolute;
        bottom: 160px;
        width: 960px;
        padding: 28px 36px;
        background: rgba(31, 25, 21, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 107, 53, 0.3);
        border-radius: 24px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }

      .caption-text {
        font-size: 32px;
        line-height: 1.35;
        font-weight: 600;
        color: #ffffff;
      }

      .caption-text span {
        color: #ff6b35;
      }
    </style>
  </head>
  <body>
    <div id="scene2" class="clip" data-start="8.00" data-duration="18.00">
      <div class="scene-wrap">
        <div class="viewport-stage">
          <div class="stage-glass-highlight"></div>
          <div id="camera-rig" class="video-wrapper">
            <video
              id="hero-video"
              src="../assets/demo.mp4"
              muted
              playsinline
              data-start="8.00"
              data-duration="18.00"
            ></video>
          </div>
        </div>

        <div id="caption-bar" class="caption-box">
          <p id="caption-content" class="caption-text">
            <span>Direct tool execution</span> with real-time terminal output.
          </p>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Camera pan and gentle zoom across the hero footage
      tl.from(".viewport-stage", { scale: 0.92, opacity: 0, duration: 0.8, ease: "power2.out" }, 0.1)
        .from("#caption-bar", { opacity: 0, y: 30, duration: 0.6, ease: "back.out(1.2)" }, 0.4)
        .to("#camera-rig", {
          x: -120,
          y: -40,
          scale: 1.15,
          duration: 9.0,
          ease: "sine.inOut"
        }, 0.5)
        .to("#caption-content", {
          opacity: 0,
          duration: 0.3,
          onComplete: () => {
            document.getElementById("caption-content").innerHTML = "Navigates complex repos and <span>plans multi-file refactors</span>.";
          }
        }, 8.0)
        .to("#caption-content", { opacity: 1, duration: 0.4 }, 8.4)
        .to("#camera-rig", {
          x: 40,
          y: 20,
          scale: 1.08,
          duration: 8.5,
          ease: "sine.inOut"
        }, 9.5);

      window.__timelines["scene2"] = tl;
    </script>
  </body>
</html>
