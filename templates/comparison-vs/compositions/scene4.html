<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scene 4: Final Verdict</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 400;
        src: url(../assets/fonts/geist-400.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 600;
        src: url(../assets/fonts/geist-600.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 700;
        src: url(../assets/fonts/geist-700.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1080px;
        height: 1920px;
        background: transparent;
        color: #f5f5f5;
        font-family: "Geist", sans-serif;
        overflow: hidden;
      }

      .scene-wrap {
        position: relative;
        width: 1080px;
        height: 1920px;
        padding: 180px 72px 140px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .verdict-card {
        background: #1c1c1c;
        border: 2px solid #3b82f6;
        border-radius: 36px;
        padding: 60px 48px;
        text-align: center;
        box-shadow: 0 30px 60px rgba(59, 130, 246, 0.2);
        margin: 40px 0;
      }

      .v-badge {
        display: inline-flex;
        padding: 8px 24px;
        background: rgba(59, 130, 246, 0.15);
        color: #3b82f6;
        border-radius: 9999px;
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 24px;
      }

      .v-title {
        font-size: 64px;
        font-weight: 700;
        line-height: 1.15;
        color: #ffffff;
      }

      .v-title span {
        color: #3b82f6;
      }

      .vote-cta-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 32px;
        background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
        border-radius: 24px;
        color: #ffffff;
        font-size: 34px;
        font-weight: 700;
        box-shadow: 0 20px 40px rgba(37, 99, 235, 0.4);
      }

      .foot-vote {
        text-align: center;
        font-size: 26px;
        color: #888888;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <div id="scene4" class="clip" data-start="33.00" data-duration="11.00">
      <div class="scene-wrap">
        <div>
          <div id="v-box" class="verdict-card">
            <div class="v-badge">🏆 THE CLEAR WINNER</div>
            <h2 class="v-title">
              <span>Option B</span> takes the crown across speed, cost, and open freedom.
            </h2>
          </div>
        </div>

        <div id="cta-v">
          <div class="vote-cta-btn">
            Drop Your Thoughts in the Comments
          </div>
          <p class="foot-vote">Which one do you use in your daily stack?</p>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#v-box", { opacity: 0, scale: 0.9, y: 30, duration: 0.8, ease: "back.out(1.3)" }, 0.2)
        .from("#cta-v", { opacity: 0, y: 40, duration: 0.7, ease: "power2.out" }, 0.8)
        .to(".vote-cta-btn", { scale: 1.03, repeat: 1, yoyo: true, duration: 1.5, ease: "sine.inOut" }, 1.6);

      window.__timelines["scene4"] = tl;
    </script>
  </body>
</html>
