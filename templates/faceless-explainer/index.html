<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Faceless Explainer Reel</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 400;
        src: url(assets/fonts/geist-400.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 600;
        src: url(assets/fonts/geist-600.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 700;
        src: url(assets/fonts/geist-700.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0f172a;
        color: #f8fafc;
        font-family: "Geist", sans-serif;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0f172a;
      }

      .bg-glow {
        position: absolute;
        width: 850px;
        height: 850px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(14, 165, 233, 0.16) 0%, rgba(14, 165, 233, 0) 70%);
        pointer-events: none;
        z-index: 0;
      }

      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="42.00"
      data-width="1080"
      data-height="1920"
    >
      <div class="bg-glow" style="left: 100px; top: 160px;"></div>
      <div class="bg-glow" style="right: -80px; bottom: 260px;"></div>

      <!-- Scene 1: Kinetic Hook Question (0.00 - 8.00) -->
      <div
        id="slot-scene-1"
        class="clip"
        data-composition-id="scene1"
        data-composition-src="compositions/scene1.html"
        data-start="0"
        data-duration="8.00"
        data-track-index="1"
      ></div>

      <!-- Scene 2: The Core Problem / Obstacle (8.00 - 20.00) -->
      <div
        id="slot-scene-2"
        class="clip"
        data-composition-id="scene2"
        data-composition-src="compositions/scene2.html"
        data-start="8.00"
        data-duration="12.00"
        data-track-index="1"
      ></div>

      <!-- Scene 3: The Secret Framework / Solution (20.00 - 32.00) -->
      <div
        id="slot-scene-3"
        class="clip"
        data-composition-id="scene3"
        data-composition-src="compositions/scene3.html"
        data-start="20.00"
        data-duration="12.00"
        data-track-index="1"
      ></div>

      <!-- Scene 4: The Golden Rule & Conclusion (32.00 - 42.00) -->
      <div
        id="slot-scene-4"
        class="clip"
        data-composition-id="scene4"
        data-composition-src="compositions/scene4.html"
        data-start="32.00"
        data-duration="10.00"
        data-track-index="1"
      ></div>

      <audio
        id="narration"
        class="clip"
        src="assets/narration.wav"
        data-start="0"
        data-duration="42.00"
        data-track-index="10"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const mainTl = gsap.timeline({ paused: true });
      window.__timelines["main"] = mainTl;
    </script>
  </body>
</html>
