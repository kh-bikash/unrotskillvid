<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scene 1: Hook</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 400;
        src: url(../assets/fonts/geist-400.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 600;
        src: url(../assets/fonts/geist-600.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 700;
        src: url(../assets/fonts/geist-700.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1080px;
        height: 1920px;
        background: transparent;
        color: #f7f2eb;
        font-family: "Geist", sans-serif;
        overflow: hidden;
      }

      .scene-wrap {
        position: relative;
        width: 1080px;
        height: 1920px;
        padding: 180px 72px 120px 72px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 12px 24px;
        background: rgba(255, 107, 53, 0.12);
        border: 1px solid rgba(255, 107, 53, 0.35);
        border-radius: 9999px;
        color: #ff6b35;
        font-size: 24px;
        font-weight: 600;
        width: fit-content;
        margin-bottom: 36px;
      }

      .badge-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ff6b35;
        box-shadow: 0 0 12px #ff6b35;
      }

      .headline {
        font-size: 84px;
        line-height: 1.08;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #ffffff;
        margin-bottom: 28px;
      }

      .highlight {
        color: #ff6b35;
      }

      .subhead {
        font-size: 32px;
        line-height: 1.45;
        color: #a79c91;
        max-width: 860px;
        margin-bottom: 80px;
      }

      /* Hero Character Card */
      .card-preview {
        position: relative;
        width: 100%;
        background: #1f1915;
        border: 1px solid #3b332b;
        border-radius: 32px;
        padding: 40px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
      }

      .card-header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 32px;
        padding-bottom: 20px;
        border-bottom: 1px solid #2c251f;
      }

      .dots {
        display: flex;
        gap: 8px;
      }

      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #3b332b;
      }

      .card-title {
        font-size: 24px;
        font-weight: 600;
        color: #e8ded4;
      }

      .card-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 24px;
        background: #16120f;
        border-radius: 18px;
        margin-bottom: 16px;
        border: 1px solid rgba(255, 255, 255, 0.04);
      }

      .row-label {
        font-size: 26px;
        font-weight: 600;
        color: #f7f2eb;
      }

      .row-val {
        font-size: 24px;
        font-weight: 600;
        color: #ff6b35;
      }
    </style>
  </head>
  <body>
    <div id="scene1" class="clip" data-start="0" data-duration="8.00">
      <div class="scene-wrap">
        <div id="badge-1" class="badge">
          <div class="badge-dot"></div>
          <span>PRODUCT BREAKTHROUGH</span>
        </div>

        <h1 id="title-1" class="headline">
          The new way to build <span class="highlight">autonomous agents</span>.
        </h1>

        <p id="sub-1" class="subhead">
          Engineered for developers who need extreme precision, native tool calling, and full repo control.
        </p>

        <div id="hero-card" class="card-preview">
          <div class="card-header">
            <div class="dots">
              <div class="dot"></div>
              <div class="dot"></div>
              <div class="dot"></div>
            </div>
            <div class="card-title">agent_runtime_core.ts</div>
          </div>
          <div class="card-row">
            <span class="row-label">Multi-file refactor</span>
            <span class="row-val">100% Autonomous</span>
          </div>
          <div class="card-row">
            <span class="row-label">Benchmark Accuracy</span>
            <span class="row-val">Top Tier Parity</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#badge-1", { opacity: 0, y: -20, duration: 0.6, ease: "power2.out" }, 0.2)
        .from("#title-1", { opacity: 0, y: 30, duration: 0.8, ease: "power2.out" }, 0.4)
        .from("#sub-1", { opacity: 0, y: 20, duration: 0.7, ease: "power2.out" }, 0.8)
        .from("#hero-card", { opacity: 0, scale: 0.94, y: 40, duration: 0.9, ease: "back.out(1.4)" }, 1.1)
        .to("#hero-card", { y: -10, repeat: 1, yoyo: true, duration: 3, ease: "sine.inOut" }, 2.0);

      window.__timelines["scene1"] = tl;
    </script>
  </body>
</html>
