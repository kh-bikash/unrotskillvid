<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scene 3: Architecture & Nuance</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 400;
        src: url(../assets/fonts/geist-400.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 600;
        src: url(../assets/fonts/geist-600.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 700;
        src: url(../assets/fonts/geist-700.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1080px;
        height: 1920px;
        background: transparent;
        color: #f7f2eb;
        font-family: "Geist", sans-serif;
        overflow: hidden;
      }

      .scene-wrap {
        position: relative;
        width: 1080px;
        height: 1920px;
        padding: 160px 72px 140px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .diagram-area {
        position: relative;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 24px;
        margin-top: 40px;
      }

      .metric-card {
        background: #1f1915;
        border: 1px solid #3b332b;
        border-radius: 28px;
        padding: 36px 40px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }

      .metric-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .metric-title {
        font-size: 28px;
        font-weight: 600;
        color: #e8ded4;
      }

      .metric-badge {
        font-size: 22px;
        font-weight: 700;
        color: #ff6b35;
        background: rgba(255, 107, 53, 0.15);
        padding: 6px 18px;
        border-radius: 9999px;
      }

      .bar-track {
        width: 100%;
        height: 20px;
        background: #16120f;
        border-radius: 10px;
        overflow: hidden;
        position: relative;
        border: 1px solid #2c251f;
      }

      .bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #ff6b35 0%, #ffa500 100%);
        border-radius: 10px;
        width: 0%;
      }

      .bottom-copy {
        margin-top: auto;
      }

      .headline-bottom {
        font-size: 68px;
        line-height: 1.15;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 20px;
      }

      .sub-bottom {
        font-size: 30px;
        line-height: 1.45;
        color: #a79c91;
      }
    </style>
  </head>
  <body>
    <div id="scene3" class="clip" data-start="26.00" data-duration="9.00">
      <div class="scene-wrap">
        <div class="diagram-area">
          <div id="card-metric-1" class="metric-card">
            <div class="metric-header">
              <span class="metric-title">Active Inference Cost</span>
              <span class="metric-badge">-30% Lower</span>
            </div>
            <div class="bar-track">
              <div id="fill-1" class="bar-fill" style="width: 70%;"></div>
            </div>
          </div>

          <div id="card-metric-2" class="metric-card">
            <div class="metric-header">
              <span class="metric-title">Context Window Capacity</span>
              <span class="metric-badge">200K Tokens</span>
            </div>
            <div class="bar-track">
              <div id="fill-2" class="bar-fill" style="width: 95%;"></div>
            </div>
          </div>
        </div>

        <div class="bottom-copy">
          <h2 id="copy-title-3" class="headline-bottom">
            Frontier reasoning at fraction of token overhead.
          </h2>
          <p id="copy-sub-3" class="sub-bottom">
            Mixture-of-Experts architecture activates only essential routing per step.
          </p>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#card-metric-1", { opacity: 0, x: -40, duration: 0.7, ease: "power2.out" }, 0.2)
        .from("#fill-1", { width: "0%", duration: 1.2, ease: "power3.out" }, 0.4)
        .from("#card-metric-2", { opacity: 0, x: 40, duration: 0.7, ease: "power2.out" }, 0.6)
        .from("#fill-2", { width: "0%", duration: 1.2, ease: "power3.out" }, 0.8)
        .from("#copy-title-3", { opacity: 0, y: 30, duration: 0.7, ease: "power2.out" }, 1.1)
        .from("#copy-sub-3", { opacity: 0, y: 20, duration: 0.6, ease: "power2.out" }, 1.4);

      window.__timelines["scene3"] = tl;
    </script>
  </body>
</html>
